<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divyum Maheshwari</title>
<style>
:root {
  --pink:   #ff0080;
  --h:      #e0e0e0;
  --body:   #888888;
  --dim:    #555555;
  --bg:     #0d0d0d;
  --line:   rgba(255,255,255,0.08);
  --font:   "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:var(--bg); color:var(--h);
  font-family:var(--font); font-weight:700; overflow:hidden; user-select:none; }

canvas#bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

/* scanlines */
body::after { content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.10) 2px,rgba(0,0,0,0.10) 4px);
  pointer-events:none; z-index:999; }

/* dark centre vignette */
#vig { position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 65% 85% at 50% 55%, rgba(13,13,13,0.78) 0%, rgba(13,13,13,0.25) 100%); }

/* ── UI shell ─────────────────────────────────────────────── */
#ui { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; }

#topbar { display:flex; justify-content:space-between; align-items:center;
  padding:18px 32px 0; font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
  color:var(--dim); }
#topbar a { color:var(--dim); text-decoration:none; transition:color .15s; }
#topbar a:hover { color:var(--pink); }

/* ── XMB ──────────────────────────────────────────────────── */
#xmb { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding-bottom:52px; }

/* category icon track */
#cat-track { position:relative; width:100%; height:96px; }
.cat-item { position:absolute; top:50%; display:flex; flex-direction:column;
  align-items:center; gap:7px; cursor:pointer;
  transition:left .32s cubic-bezier(.25,.46,.45,.94), opacity .32s; }
.cat-icon svg { display:block; fill:none; stroke:currentColor;
  stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;
  transition:width .28s,height .28s,filter .28s,color .28s; }
.cat-lbl { font-size:9px; letter-spacing:0.28em; text-transform:uppercase; white-space:nowrap; }

/* category divider */
#xmb-divider { width:240px; height:1px; flex-shrink:0; margin:2px 0 16px;
  background:linear-gradient(90deg,transparent,rgba(255,0,128,0.45),transparent); }

/* ── Panels (L2 list | rule | L3 detail) ─────────────────── */
#panels { display:grid; grid-template-columns:220px 1px 1fr;
  gap:0 0; width:min(820px,88vw); min-height:200px; align-items:start; }

#l2-list { display:flex; flex-direction:column; padding-right:20px; }
.l2-item { display:flex; align-items:center; gap:8px; padding:8px 10px;
  cursor:pointer; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--dim); border-left:2px solid transparent; transition:color .1s,background .1s; }
.l2-item .arr { font-size:7px; color:var(--pink); opacity:0; flex-shrink:0; width:8px; }
.l2-item.active { color:var(--h); border-left-color:var(--pink); background:rgba(255,0,128,0.05); }
.l2-item.active .arr { opacity:1; }
.l2-item:hover:not(.active) { color:#aaa; }

#v-rule { background:var(--line); width:1px; margin:0 20px; align-self:stretch; }

#r-panel { padding-left:4px; min-height:180px; }

/* L3 sub-list (when L2 has children) */
#l3-list { display:flex; flex-direction:column; gap:0; margin-bottom:16px; }
.l3-item { display:flex; align-items:center; gap:8px; padding:7px 10px;
  cursor:pointer; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--dim); border-left:2px solid transparent; transition:color .1s,background .1s; }
.l3-item .arr { font-size:6px; color:var(--pink); opacity:0; flex-shrink:0; width:8px; }
.l3-item.active { color:var(--h); border-left-color:rgba(255,0,128,0.55); background:rgba(255,0,128,0.04); }
.l3-item.active .arr { opacity:1; }
.l3-item:hover:not(.active) { color:#999; }

/* Detail text */
#detail { font-size:11px; letter-spacing:0.05em; line-height:1.9;
  color:var(--body); font-weight:400; transition:opacity .18s; max-width:480px;
  white-space:pre-line; }
#detail strong { color:var(--h); font-weight:700; }

/* breadcrumb */
#breadcrumb { font-size:9px; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--dim); margin-bottom:14px; }
#breadcrumb span { color:var(--pink); }

/* ── Footer ──────────────────────────────────────────────── */
#footer { padding:0 32px 18px; display:flex; justify-content:center; gap:36px;
  font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--dim); flex-shrink:0; }

/* ── Mobile ───────────────────────────────────────────────── */
@media (max-width:640px) {
  #panels { grid-template-columns:1fr; }
  #v-rule { display:none; }
  #r-panel { padding-left:0; padding-top:16px; }
  html,body { overflow-y:auto; height:auto; }
  #ui,canvas#bg { position:relative; }
  #xmb { padding-bottom:24px; }
}
</style>
</head>

<script>

  {

          { label:'Scaling Design Education · Licensure Exams', desc:'Research and data project exploring the systemic challenges of scaling design education through formal licensure frameworks in India. Analysis of policy, pedagogy, and institutional barriers.' },

          { label:"Boeing's Demise · An Essay", desc:"Analysis of Boeing's decline from engineering-driven excellence to PR-first short-termism.\n\nKey events: Lion Air 610, Ethiopian Airlines 302, Alaska Flight 1282, Starliner incident.\nConsequences: $2.5B fraud settlement · $200M investor deception fine · Deferred safety fixes · Repeated delays in 777X delivery.\n\nRecommendations: Return to engineering-driven leadership · Reinstate transparency and long-term planning · Eliminate toxic culture inherited from McDonnell Douglas merger." },

  },
  {
    key:'education', label:'Alma Matters',
    icon:`<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="6" x2="16" y2="6"/><line x1="12" y1="10" x2="16" y2="10"/></svg>`,
    items:[
      { label:'Imperial College London', desc:'MSc. Design Engineering\nSpecialisation in Design Engineering · London, UK' },
      { label:'Atlas SkillTech University', desc:'Bachelor\'s in Administration\nSpecialisation in Strategic Design · Minor in Programming · Mumbai, India' },
      { label:'IIT Madras', desc:'Diploma in Programming\nFirst in Jodhpur batch · Subject Topper · Qualifier · Chennai, India' },
      { label:'Two Year Sabbatical', desc:'Self-directed learning through travel.\nAudit Semester in Foundational Pre-Design · Charter in Product Management · Science Stream with Fine Arts · Know Hindi and English as core languages.' },
    ]
  },
  {
    key:'experience', label:'Experience',
    icon:`<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="2" y1="13" x2="22" y2="13"/></svg>`,
    items:[
      { label:'Ercon Composites', desc:'Product Design Intern · Aug 2023 — Apr 2024 · Mumbai, India\n\nDeveloped product lines, created specifications, managed fabrication workflows, and qualified products for international clients. Products supplied to NEOM City, KSA.' },
    ]
  },
  {
    key:'other', label:'Other Work',
    icon:`<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    items:[
      {
        label:'Product Pitches',
        children:[
          { label:'Jupyter Neo Bank', desc:'Product management pitch for a neo-banking product built around the Jupyter ecosystem — financial infrastructure for data scientists and researchers.' },
          { label:'Drone / UAV Surveillance ML', desc:'Machine learning presentation on drone and UAV-based surveillance systems — technical architecture, use cases, and ethical considerations.' },
          { label:'Pharmeasy Marketing', desc:'Marketing intervention strategy for Pharmeasy — customer acquisition, retention mechanics, and brand positioning in India\'s online pharmacy market.' },
          { label:'Wakefit · Sale Intervention', desc:'Sales intervention design for Wakefit — conversion funnel analysis and tactical recommendations for the D2C sleep products brand.' },
          { label:'Netflix Kids · Content Curation', desc:'Content strategy and curation system design for Netflix Kids — taxonomy, recommendation logic, and parental control UX.' },
          { label:"Meta's VR Problem", desc:"Analysis of Meta's strategic challenges in the VR/AR consumer space — adoption barriers, platform economics, and path to mainstream viability." },
        ]
      },
      {
        label:'Drawing & Imaging',
        children:[
          { label:'Human Anatomy Exploration', desc:'Extended series of anatomical studies exploring the human form through ink-based sketching and structural observation.' },
          { label:'Geometrical Exploration in 2D', desc:'Visual and structural exploration of geometric forms — pattern, symmetry, rhythm, and compositional relationships in two dimensions.' },
          { label:'Structure Sketching', desc:'Architectural and product structure sketching practice — rapid ideation through drawing, form development, and spatial reasoning.' },
          { label:'Ethnographic · Maharashtran Village', desc:'Visual ethnography of a Maharashtran village — documentary drawing and image-making capturing culture, space, and daily life.' },
        ]
      },
      {
        label:'Achievements',
        children:[
          { label:'Hackathon · Top 8 / 375 Teams', desc:'Top 8 finalist out of 375 competing teams in a hackathon with technical pitching component.' },
          { label:'Hackathon · 2nd Place / 1500 Teams', desc:'Second Place out of 1500 teams in hackathon with technical pitching.' },
          { label:'Data Narrative · 3rd Place', desc:'Third Place in Data Narrative Contest out of 30+ competing teams.' },
          { label:'IIT Madras · Subject Topper', desc:'First in Jodhpur batch to complete Programming diploma out of 30 students. IIT Madras Qualifier Subject Topper.' },
          { label:'UN SDG Scholarship', desc:'Selected for the Makers Asylum Goa UN SDG Scholarship.' },
          { label:'Presentation Prize · 120 Students', desc:'First Prize Presentation out of 120 students.' },
        ]
      },
    ]
  },
];

// ── State ─────────────────────────────────────────────────────────────────────
let catIdx = 0;
let l2Idx  = 0;
let l3Idx  = 0;
let focus  = 'l2'; // 'l2' | 'l3'

function l2Items() { return CAT[catIdx].items; }
function curL2()   { return l2Items()[l2Idx]; }
function hasL3()   { return !!(curL2().children && curL2().children.length); }
function l3Items() { return hasL3() ? curL2().children : []; }

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  const d = new Date();
  document.getElementById('clk').textContent =
    d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick, 20000);

// ── Render ────────────────────────────────────────────────────────────────────
const trackEl = document.getElementById('cat-track');
const l2El    = document.getElementById('l2-list');
const l3El    = document.getElementById('l3-list');
const detEl   = document.getElementById('detail');
const bcEl    = document.getElementById('breadcrumb');

function renderCats() {
  trackEl.innerHTML = '';
  const W = window.innerWidth;
  const cx = W / 2;
  const spc = Math.min(130, W / 6.5);

  CAT.forEach((cat, i) => {
    const el  = document.createElement('div');
    el.className = 'cat-item';
    const off = i - catIdx;
    const abs = Math.abs(off);
    const sz  = abs === 0 ? 54 : abs === 1 ? 38 : 28;
    const col = abs === 0 ? 'var(--h)' : abs === 1 ? '#555' : '#333';
    const glow= abs === 0 ? `drop-shadow(0 0 8px rgba(255,0,128,.65)) drop-shadow(0 0 20px rgba(255,0,128,.28))` : 'none';
    const lop = abs === 0 ? 1 : 0;

    el.innerHTML = `
      <div class="cat-icon" style="color:${col};filter:${glow}">
        ${cat.icon.replace('<svg','<svg width="'+sz+'" height="'+sz+'"')}
      </div>
      <div class="cat-lbl" style="color:${abs===0?'var(--pink)':'transparent'};opacity:${lop}">${cat.label.toUpperCase()}</div>`;

    el.style.cssText = `left:${cx + off*spc}px;transform:translateX(-50%) translateY(-50%);opacity:${abs===0?1:abs===1?0.42:0.16}`;
    el.addEventListener('click', () => { catIdx=i; l2Idx=0; l3Idx=0; focus='l2'; render(); });
    trackEl.appendChild(el);
  });
}

function renderL2() {
  l2El.innerHTML = '';
  l2Items().forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'l2-item' + (i===l2Idx && focus==='l2' ? ' active' : i===l2Idx ? ' active' : '');
    el.innerHTML = `<span class="arr">▶</span><span>${item.label.toUpperCase()}</span>`;
    el.addEventListener('click', () => { l2Idx=i; l3Idx=0; focus='l2'; renderL2(); renderRight(); });
    l2El.appendChild(el);
  });
}

function renderRight() {
  const cat  = CAT[catIdx];
  const item = curL2();

  // breadcrumb
  if (hasL3()) {
    bcEl.innerHTML = `${cat.label.toUpperCase()} &nbsp;/&nbsp; <span>${item.label.toUpperCase()}</span>`;
  } else {
    bcEl.innerHTML = `${cat.label.toUpperCase()} &nbsp;/&nbsp; <span>${item.label.toUpperCase()}</span>`;
  }

  // L3 list
  l3El.innerHTML = '';
  if (hasL3()) {
    l3Items().forEach((child, i) => {
      const el = document.createElement('div');
      el.className = 'l3-item' + (i===l3Idx ? ' active' : '');
      el.innerHTML = `<span class="arr">▶</span><span>${child.label.toUpperCase()}</span>`;
      el.addEventListener('click', () => { l3Idx=i; focus='l3'; renderL3Active(); renderDetail(); });
      l3El.appendChild(el);
    });
  }

  renderDetail();
}

function renderL3Active() {
  document.querySelectorAll('.l3-item').forEach((el,i) => {
    el.classList.toggle('active', i===l3Idx);
  });
}

function renderDetail() {
  const item = curL2();
  let text = '';

  if (hasL3()) {
    const child = l3Items()[l3Idx];
    text = child ? child.desc || '' : '';
  } else {
    text = item.desc || '';
    if (item.link) {
      detEl.innerHTML = `<a href="${item.link}" target="_blank" rel="noopener" style="color:var(--pink);text-decoration:none">${item.desc}</a>`;
      detEl.style.opacity='1';
      return;
    }
  }
  detEl.style.opacity='0';
  setTimeout(() => { detEl.textContent = text; detEl.style.opacity='1'; }, 90);
}

function render() {
  renderCats();
  renderL2();
  renderRight();
}
render();
window.addEventListener('resize', renderCats);

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const nCat = CAT.length;
  const nL2  = l2Items().length;
  const nL3  = hasL3() ? l3Items().length : 0;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (focus === 'l3') { focus='l2'; renderL2(); return; }
    catIdx = (catIdx - 1 + nCat) % nCat; l2Idx=0; l3Idx=0; focus='l2'; render();
  }
  else if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (focus === 'l2' && hasL3()) { focus='l3'; renderL2(); return; }
    catIdx = (catIdx + 1) % nCat; l2Idx=0; l3Idx=0; focus='l2'; render();
  }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (focus === 'l3' && nL3 > 0) { l3Idx=(l3Idx+1)%nL3; renderL3Active(); renderDetail(); }
    else { l2Idx=(l2Idx+1)%nL2; l3Idx=0; renderL2(); renderRight(); }
  }
  else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (focus === 'l3' && nL3 > 0) { l3Idx=(l3Idx-1+nL3)%nL3; renderL3Active(); renderDetail(); }
    else { l2Idx=(l2Idx-1+nL2)%nL2; l3Idx=0; renderL2(); renderRight(); }
  }
  else if (e.key === 'Enter') {
    if (focus==='l2' && hasL3()) { focus='l3'; renderL2(); }
    else if (curL2().link) window.open(curL2().link,'_blank');
  }
  else if (e.key === 'Escape') {
    if (focus==='l3') { focus='l2'; renderL2(); }
  }
});

// ── Canvas background ─────────────────────────────────────────────────────────
(function(){
  const cv  = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  let W, H, t=0;
  let matRows=[], filmPerfs=[];

  // Zone boundaries (fraction of W)
  const Z_ROOM  = 0.34; // 0 → Z_ROOM: pixel art rooms
  const Z_FILM  = 0.44; // Z_ROOM → Z_FILM: film strip
  const Z_MAT   = 0.97; // Z_FILM → Z_MAT: matrix numbers
  // Z_MAT → 1.0: pink stripe

  function rnd(a,b){ return a+Math.random()*(b-a); }
  function rndI(a,b){ return Math.floor(rnd(a,b+1)); }
  function coord(){ return rndI(0,2500)+','+rndI(0,2000)+','+rndI(0,1500)+','+rndI(0,999); }

  const ROOM_PALETTES = [
    { wall:'#4a2e1a', floor1:'#8b5e3c', floor2:'#6b4422', accent:'#e8a040', trim:'#2a1a0a' },
    { wall:'#1a2a4a', floor1:'#2a4060', floor2:'#1a3050', accent:'#40a0e0', trim:'#0a1525' },
    { wall:'#2a1a3a', floor1:'#503060', floor2:'#3a2050', accent:'#c060e0', trim:'#150a20' },
    { wall:'#1a3a2a', floor1:'#285040', floor2:'#1e3a2e', accent:'#50c080', trim:'#0a1e14' },
  ];

  function initMatrix(){
    matRows=[];
    const lineH = 14;
    const count = Math.ceil(H/lineH)+2;
    for(let i=0;i<count;i++){
      matRows.push({ y: i*lineH, vals: Array.from({length:18},()=>rndI(0,2500)), age:rnd(0,1000) });
    }
  }

  function resize(){
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    initMatrix();
  }

  // Draw a single pixel-art room
  function drawRoom(x0,y0,rW,rH,pal){
    const px=Math.max(2,Math.floor(rW/60));

    // Background
    ctx.fillStyle = pal.wall;
    ctx.fillRect(x0,y0,rW,rH);

    // Floor tiles (bottom 30%)
    const floorY = y0 + rH*0.68;
    for(let fx=x0;fx<x0+rW;fx+=px*4){
      for(let fy=floorY;fy<y0+rH;fy+=px*2){
        ctx.fillStyle = ((fx+fy)/px)%2===0 ? pal.floor1 : pal.floor2;
        ctx.fillRect(fx,fy,px*4,px*2);
      }
    }

    // Back wall darkened stripe
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(x0,y0,rW,rH*0.12);

    // Windows (back wall)
    const winW=px*8, winH=px*10;
    const winY=y0+rH*0.15;
    const winCount=Math.floor(rW/(winW*3));
    for(let wi=0;wi<winCount;wi++){
      const wx=x0+(wi+0.5)*(rW/(winCount))-winW/2;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(wx-px,winY-px,winW+px*2,winH+px*2);
      const lit=Math.random()>0.3;
      ctx.fillStyle=lit?'rgba(255,220,140,0.75)':'rgba(40,60,100,0.5)';
      ctx.fillRect(wx,winY,winW,winH);
      // window cross
      ctx.fillStyle='rgba(0,0,0,0.4)';
      ctx.fillRect(wx+winW/2-px/2,winY,px,winH);
      ctx.fillRect(wx,winY+winH/2-px/2,winW,px);
    }

    // Decorative columns / pillars
    const colW=px*3;
    for(let ci=0;ci<3;ci++){
      const cx2=x0+(ci+1)*(rW/4)-colW/2;
      ctx.fillStyle=pal.trim;
      ctx.fillRect(cx2,y0+rH*0.1,colW,rH*0.6);
      ctx.fillStyle=pal.accent+'44';
      ctx.fillRect(cx2-px,y0+rH*0.1,px,rH*0.6);
    }

    // Pixel art "trees" / decorative blobs
    [[0.1,0.55],[0.85,0.50]].forEach(([fx2,fy2])=>{
      const tx=x0+rW*fx2, ty=y0+rH*fy2;
      const tr=px*5;
      // canopy
      ctx.fillStyle=pal.accent+'88';
      ctx.fillRect(tx-tr,ty-tr*2,tr*2,tr*2);
      ctx.fillStyle=pal.accent+'55';
      ctx.fillRect(tx-tr+px,ty-tr*3,tr*2-px*2,tr);
      // trunk
      ctx.fillStyle=pal.floor1;
      ctx.fillRect(tx-px,ty,px*2,tr);
    });

    // Room border (blue highlight on selected room style)
    if(Math.random()>0.65){
      ctx.strokeStyle=pal.accent+'66';
      ctx.lineWidth=2;
      ctx.strokeRect(x0+1,y0+1,rW-2,rH-2);
    }

    // Subtle vignette inside room
    const rv=ctx.createLinearGradient(x0,y0,x0,y0+rH);
    rv.addColorStop(0,'rgba(0,0,0,0.35)');
    rv.addColorStop(0.4,'transparent');
    rv.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=rv;
    ctx.fillRect(x0,y0,rW,rH);
  }

  function drawRooms(){
    const rW = W*Z_ROOM;
    const rH = H/4;
    ROOM_PALETTES.forEach((pal,i)=>{
      drawRoom(0, i*rH, rW, rH, pal);
    });
    // thin separator lines between rooms
    for(let i=1;i<4;i++){
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(0,i*H/4-1,rW,2);
    }
  }

  function drawFilmStrip(){
    const fx = W*Z_ROOM;
    const fw = W*(Z_FILM-Z_ROOM);
    ctx.fillStyle='rgba(0,0,0,0.92)';
    ctx.fillRect(fx,0,fw,H);

    // Perforations
    const ph=10,pw=7,pGap=20,margin=4;
    for(let py=6;py<H-ph;py+=pGap){
      ctx.fillStyle='rgba(255,255,255,0.88)';
      ctx.fillRect(fx+margin,py,pw,ph);
      ctx.fillRect(fx+fw-margin-pw,py,pw,ph);
    }

    // Pink edge glow
    const eg=ctx.createLinearGradient(fx,0,fx+fw,0);
    eg.addColorStop(0,'rgba(255,0,128,0.2)');
    eg.addColorStop(0.5,'transparent');
    eg.addColorStop(1,'rgba(255,0,128,0.14)');
    ctx.fillStyle=eg;
    ctx.fillRect(fx,0,fw,H);
  }

  const NCOLS_COLORS=['#ff4040','#4488ff','#40ff88','#ffffff','#ff9040','#ffffff'];

  function drawMatrix(){
    const mx = W*Z_FILM;
    const mw = W*(Z_MAT-Z_FILM);
    // dark background
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(mx,0,mw,H);

    ctx.font='10px "Helvetica Neue",Helvetica,monospace';
    const lineH=14;

    matRows.forEach(row=>{
      row.age+=0.3;
      if(Math.random()<0.004) row.vals=Array.from({length:18},()=>rndI(0,2500));

      let x=mx+8;
      row.vals.forEach((v,vi)=>{
        const col=NCOLS_COLORS[vi%NCOLS_COLORS.length];
        const r2=parseInt(col.slice(1,3),16);
        const g2=parseInt(col.slice(3,5),16);
        const b2=parseInt(col.slice(5,7),16);
        ctx.fillStyle=`rgba(${r2},${g2},${b2},0.24)`;
        const str=v+',';
        ctx.fillText(str,x,row.y);
        x+=ctx.measureText(str).width;
        if(x>mx+mw-20) return;
      });
    });
  }

  function drawPinkStripe(){
    const px=W*Z_MAT;
    const pw=W*(1-Z_MAT);
    ctx.fillStyle='#ff0080';
    ctx.fillRect(px,0,pw,H);
    // subtle left glow
    const sg=ctx.createLinearGradient(px-20,0,px+pw,0);
    sg.addColorStop(0,'rgba(255,0,128,0.2)');
    sg.addColorStop(0.3,'transparent');
    ctx.fillStyle=sg;
    ctx.fillRect(px-20,0,pw+20,H);
  }

  function frame(ts){
    t=ts*0.001;
    // Clear
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);

    drawRooms();
    drawFilmStrip();
    drawMatrix();
    drawPinkStripe();

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();
</script>
