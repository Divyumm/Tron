<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divyum Maheshwari</title>
<style>
/* ── Set your photo path here ─────────────────────── */
/* const PHOTO_SRC = './yourphoto.jpg';               */

:root {
  --cobalt: #005BFF;
  --white:  #e8e8e8;
  --mid:    #888888;
  --dim:    #555555;
  --font:   "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #080810;
  color: var(--white);
  font-family: var(--font);
  font-weight: 700;
  overflow: hidden;
  user-select: none;
}

canvas#bg { position: fixed; inset: 0; z-index: 0; }

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none; z-index: 999;
}

/* ── UI shell ─────────────────────────────────────── */
#ui { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; }

/* ── Topbar ───────────────────────────────────────── */
#topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 36px 0;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--white); font-weight: 700; flex-shrink: 0;
}
#topbar a { color: var(--white); text-decoration: none; transition: color .2s; }
#topbar a:hover { color: var(--cobalt); }

/* ── Stage ────────────────────────────────────────── */
#stage {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden; position: relative;
  padding-bottom: 16px;
}

/* ── Category carousel ────────────────────────────── */
#cat-row {
  position: relative;
  width: 100%; height: 100px;
  flex-shrink: 0;
}
.cat-btn {
  position: absolute; top: 50%; left: 50%;
  background: none; border: none; cursor: pointer;
  font-family: var(--font); font-weight: 700;
  color: var(--white); line-height: 1;
  padding: 0; white-space: nowrap;
  transition: font-size .42s cubic-bezier(0.16,1,0.3,1),
              opacity   .42s cubic-bezier(0.16,1,0.3,1),
              color     .42s cubic-bezier(0.16,1,0.3,1),
              transform .42s cubic-bezier(0.16,1,0.3,1);
  text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7);
}
.cat-btn.selected {
  font-size: 76px;
  color: var(--white);
  opacity: 1;
}
.cat-btn.adj {
  font-size: 28px;
  color: var(--mid);
}
.cat-btn.far {
  font-size: 18px;
  color: var(--dim);
}
.cat-btn.hidden { opacity: 0 !important; pointer-events: none; }

/* open indicator under selected */
#open-hint {
  font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--cobalt); font-weight: 700;
  margin-top: 2px; text-align: center;
  flex-shrink: 0; height: 16px;
  transition: opacity .2s;
  text-shadow: 0 0 12px rgba(0,91,255,0.5);
}

/* ── Content panel (wiki-style) ───────────────────── */
#content-panel {
  width: min(680px, 88vw);
  max-height: 0;
  overflow: hidden;
  transition: max-height .52s cubic-bezier(0.16,1,0.3,1),
              opacity     .32s cubic-bezier(0.16,1,0.3,1);
  opacity: 0;
  background: rgba(0,0,0,0.72);
  border-top: 1px solid rgba(255,255,255,0.09);
}
#content-panel.open {
  max-height: 52vh;
  opacity: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,91,255,0.4) transparent;
}
#content-panel::-webkit-scrollbar { width: 2px; }
#content-panel::-webkit-scrollbar-thumb { background: var(--cobalt); }

#content-inner { padding: 24px 28px 28px; }

/* Wiki sections */
.wi-section { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.wi-section:last-child { border-bottom: none; margin-bottom: 0; }

.wi-label {
  font-size: 22px; font-weight: 700;
  color: var(--white); letter-spacing: -0.01em;
  margin-bottom: 7px; line-height: 1;
}
.wi-desc {
  font-size: 13px; font-weight: 400;
  color: var(--mid); line-height: 1.82;
  white-space: pre-line; max-width: 540px;
}
.wi-link { color: var(--cobalt); text-decoration: none; }
.wi-link:hover { text-decoration: underline; }

/* Expandable group header */
.wi-group-btn {
  background: none; border: none; cursor: pointer;
  font-family: var(--font); font-weight: 700;
  font-size: 22px; color: var(--white);
  text-align: left; padding: 0;
  display: flex; align-items: center; gap: 10px;
  letter-spacing: -0.01em; width: 100%;
  transition: color .15s;
}
.wi-group-btn:hover { color: var(--cobalt); }
.wi-arrow {
  font-size: 12px; color: var(--cobalt);
  transition: transform .25s cubic-bezier(0.16,1,0.3,1);
  display: inline-block;
}
.wi-group-btn.expanded .wi-arrow { transform: rotate(90deg); }

.wi-children {
  max-height: 0; overflow: hidden;
  transition: max-height .4s cubic-bezier(0.16,1,0.3,1),
              opacity .28s;
  opacity: 0;
}
.wi-children.open { max-height: 2000px; opacity: 1; }

.wi-child {
  padding: 10px 0 10px 16px;
  border-left: 2px solid rgba(0,91,255,0.28);
  margin-top: 8px;
}
.wi-child-label {
  font-size: 15px; font-weight: 700;
  color: #bbb; margin-bottom: 4px;
}
.wi-child-desc {
  font-size: 12px; font-weight: 400;
  color: var(--mid); line-height: 1.78;
  white-space: pre-line;
}

/* ── Footer / nav ─────────────────────────────────── */
#footer {
  padding: 10px 36px 18px;
  display: flex; justify-content: center; align-items: center; gap: 32px;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--white); font-weight: 700; flex-shrink: 0;
  background: rgba(0,0,0,0.55);
  border-top: 1px solid rgba(255,255,255,0.07);
}
#footer span { display: flex; align-items: center; gap: 6px; }
#footer .key {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 1px 6px; font-size: 9px;
  min-width: 22px; color: var(--white);
}
</style>
</head>

<script>

// ── Data ─────────────────────────────────────────────────────────────────────
const CAT = [

        ]

          { label: 'Geometrical Exploration 2D',        desc: 'Pattern, symmetry, rhythm, and compositional relationships in two dimensions.' },
          { label: 'Structure Sketching',               desc: 'Architectural and product structure sketching — rapid ideation and spatial reasoning.' },
          { label: 'Maharashtran Village · Ethnography',desc: 'Visual ethnography — documentary drawing capturing culture, space, and daily life.' },
        ]
      },
      {
        label: 'Achievements',
        children: [
          { label: 'Hackathon · Top 8 / 375',     desc: 'Top 8 finalist out of 375 teams — Technical Pitching.' },
          { label: 'Hackathon · 2nd / 1500',      desc: 'Second Place out of 1500 teams — Technical Pitching.' },
          { label: 'Data Narrative · 3rd / 30+',  desc: 'Third Place in Data Narrative Contest.' },
          { label: 'IIT Madras · Subject Topper', desc: 'First in Jodhpur batch out of 30. Subject Topper. Qualifier.' },
          { label: 'UN SDG Scholarship',          desc: 'Selected for the Makers Asylum Goa UN SDG Scholarship.' },
          { label: 'Presentation Prize · 120',    desc: 'First Prize Presentation out of 120 students.' },

];

// ── State ─────────────────────────────────────────────────────────────────────
let catIdx   = 0;
let isOpen   = false;
let openSecs = {}; // which expandable group sections are open

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  const d = new Date();
  document.getElementById('clk').textContent =
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick, 20000);

// ── Category carousel ─────────────────────────────────────────────────────────
const catRow = document.getElementById('cat-row');

// Build buttons once
CAT.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat.label;
  btn.addEventListener('click', () => {
    if (i === catIdx) { toggleOpen(); }
    else { catIdx = i; openSecs = {}; updateCats(); renderContent(); }
  });
  catRow.appendChild(btn);
});

function updateCats() {
  const W    = window.innerWidth;
  const CX   = W / 2;
  const btns = Array.from(catRow.querySelectorAll('.cat-btn'));
  const SP   = Math.min(240, W / 5.5);

  btns.forEach((btn, i) => {
    const off = i - catIdx;
    const abs = Math.abs(off);
    // x position relative to center
    const xOff = off * SP;

    btn.style.transform = `translate(calc(-50% + ${xOff}px), -50%)`;
    btn.style.fontSize  = abs === 0 ? '76px' : abs === 1 ? '28px' : '18px';
    btn.style.opacity   = abs === 0 ? '1' : abs === 1 ? '0.55' : abs === 2 ? '0.22' : '0';
    btn.style.color     = abs === 0 ? 'var(--white)' : 'var(--mid)';
    btn.style.pointerEvents = abs <= 2 ? 'auto' : 'none';
    btn.style.zIndex    = 10 - abs;
  });

  document.getElementById('open-hint').style.opacity = isOpen ? '0' : '1';
}

// ── Open / close ──────────────────────────────────────────────────────────────
const panel      = document.getElementById('content-panel');
const innerEl    = document.getElementById('content-inner');
const openHintEl = document.getElementById('open-hint');

function toggleOpen() {
  isOpen = !isOpen;
  if (isOpen) renderContent();
  panel.classList.toggle('open', isOpen);
  openHintEl.style.opacity = isOpen ? '0' : '1';
}

function toggleSection(secKey) {
  openSecs[secKey] = !openSecs[secKey];
  // update DOM in place
  const btn  = document.querySelector(`[data-sec="${secKey}"]`);
  const kids = document.getElementById('wi-children-' + secKey);
  if (btn && kids) {
    btn.classList.toggle('expanded', openSecs[secKey]);
    kids.classList.toggle('open', openSecs[secKey]);
  }
}

// ── Render wiki content ───────────────────────────────────────────────────────
function renderContent() {
  const cat = CAT[catIdx];
  let html  = '';

  cat.items.forEach((item, i) => {
    const key = cat.key + '_' + i;

    if (item.children) {
      const isExpanded = !!openSecs[key];
      const childHTML  = item.children.map(child => `
        <div class="wi-child">
          <div class="wi-child-label">${child.label}</div>
          <div class="wi-child-desc">${child.desc || ''}</div>
        </div>`).join('');

      html += `
        <div class="wi-section">
          <button class="wi-group-btn${isExpanded ? ' expanded' : ''}"
                  data-sec="${key}"
                  onclick="toggleSection('${key}')">
            <span>${item.label}</span>
            <span class="wi-arrow">▶</span>
          </button>
          <div class="wi-children${isExpanded ? ' open' : ''}" id="wi-children-${key}">
            ${childHTML}
          </div>
        </div>`;
    } else {
      const content = item.link
        ? `<a class="wi-link" href="${item.link}" target="_blank" rel="noopener">${item.desc}</a>`
        : item.desc || '';
      html += `
        <div class="wi-section">
          <div class="wi-label">${item.label}</div>
          <div class="wi-desc">${content}</div>
        </div>`;
    }
  });

  innerEl.innerHTML = html;
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const n = CAT.length;

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    catIdx = (catIdx + 1) % n;
    openSecs = {};
    updateCats();
    if (isOpen) renderContent();
  }
  else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    catIdx = (catIdx - 1 + n) % n;
    openSecs = {};
    updateCats();
    if (isOpen) renderContent();
  }
  else if (e.key === 'Enter') {
    e.preventDefault();
    toggleOpen();
    updateCats();
  }
  else if (e.key === 'Escape') {
    e.preventDefault();
    if (isOpen) { isOpen = false; panel.classList.remove('open'); updateCats(); }
  }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    panel.scrollBy({ top: 80, behavior: 'smooth' });
  }
  else if (e.key === 'ArrowUp') {
    e.preventDefault();
    panel.scrollBy({ top: -80, behavior: 'smooth' });
  }
});

// ── Initial render ────────────────────────────────────────────────────────────
updateCats();
window.addEventListener('resize', updateCats);

// ── Canvas background ─────────────────────────────────────────────────────────
(function () {
  const cv  = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  let W, H, matRows = [], photoImg = null;

  const Z_PHOTO = 0.30;
  const Z_FILM  = 0.40;
  const Z_MAT   = 0.97;

  function rndI(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }

  function initMatrix() {
    const lh = 14;
    const count = Math.ceil(H / lh) + 2;
    matRows = Array.from({ length: count }, (_, i) => ({
      y: i * lh,
      vals: Array.from({ length: 18 }, () => rndI(0, 2500))
    }));
  }

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    initMatrix();
  }

  if (PHOTO_SRC) {
    photoImg = new Image();
    photoImg.src = PHOTO_SRC;
  }

  function drawPhoto() {
    const pw = W * Z_PHOTO;
    ctx.fillStyle = '#070710';
    ctx.fillRect(0, 0, pw, H);

    if (photoImg && photoImg.complete && photoImg.naturalWidth) {
      const iw = photoImg.naturalWidth, ih = photoImg.naturalHeight;
      const sc = Math.max(pw / iw, H / ih);
      const dw = iw * sc, dh = ih * sc;
      ctx.drawImage(photoImg, (pw - dw) / 2, (H - dh) / 2, dw, dh);
      const vg = ctx.createLinearGradient(pw - 60, 0, pw, 0);
      vg.addColorStop(0, 'transparent');
      vg.addColorStop(1, 'rgba(0,0,0,0.9)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, pw, H);
    } else {
      // Placeholder silhouette
      const cx2 = pw / 2, cy2 = H * 0.38;
      const r = Math.min(pw, H) * 0.1;
      ctx.strokeStyle = 'rgba(0,91,255,0.2)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx2, cy2 - r * 0.3, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx2 - r * 1.4, cy2 + r * 2.2);
      ctx.quadraticCurveTo(cx2, cy2 + r * 0.6, cx2 + r * 1.4, cy2 + r * 2.2);
      ctx.stroke();
      ctx.font = '700 9px "Helvetica Neue", Helvetica, sans-serif';
      ctx.fillStyle = 'rgba(0,91,255,0.28)';
      ctx.textAlign = 'center';
      ctx.fillText('ADD PHOTO', cx2, cy2 + r * 3.4);
      ctx.textAlign = 'left';
    }
  }

  function drawFilm() {
    const fx = W * Z_PHOTO, fw = W * (Z_FILM - Z_PHOTO);
    ctx.fillStyle = 'rgba(0,0,0,0.95)';
    ctx.fillRect(fx, 0, fw, H);
    const ph = 10, pw2 = 7, gap = 20, mg = 4;
    for (let py = 6; py < H - ph; py += gap) {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillRect(fx + mg, py, pw2, ph);
      ctx.fillRect(fx + fw - mg - pw2, py, pw2, ph);
    }
  }

  const MC = ['#ff4444','#4488ff','#44ff88','#ffffff','#ff9944','#ffffff'];
  function hx(hex, a) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawMatrix() {
    const mx = W * Z_FILM, mw = W * (Z_MAT - Z_FILM);
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(mx, 0, mw, H);
    ctx.font = '10px "Helvetica Neue", Helvetica, monospace';
    matRows.forEach(row => {
      if (Math.random() < 0.002) row.vals = Array.from({ length: 18 }, () => rndI(0, 2500));
      let x = mx + 6;
      row.vals.forEach((v, vi) => {
        const str = v + ',';
        ctx.fillStyle = hx(MC[vi % MC.length], 0.55); // 0.55 = full visible
        ctx.fillText(str, x, row.y);
        x += ctx.measureText(str).width;
        if (x > mx + mw - 12) return;
      });
    });
  }

  function drawCobalt() {
    const sx = W * Z_MAT, sw = W * (1 - Z_MAT);
    ctx.fillStyle = '#005BFF';
    ctx.fillRect(sx, 0, sw, H);
  }

  function frame() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawPhoto();
    drawFilm();
    drawMatrix();
    drawCobalt();
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
