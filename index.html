<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divyum Maheshwari</title>
<style>
/* ─── To add your photo: set PHOTO_SRC in the <script> below ─── */

:root {
  --cobalt:     #005BFF;
  --h:   #d8d8d8;
  --mid: #999999;
  --dim: #4a4a4a;
  --bg:  #0d0d0d;
  --rule: rgba(255,255,255,0.09);
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--h);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
}

canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

/* scanlines */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.09) 2px, rgba(0,0,0,0.09) 4px);
  pointer-events: none; z-index: 999;
}

/* ─── UI shell ────────────────────────────────────────────── */
#ui {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
}

/* ─── Topbar ─────────────────────────────────────────────── */
#topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 40px 0;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--dim); font-weight: 400;
  flex-shrink: 0;
}
#topbar a { color: var(--dim); text-decoration: none; transition: color .2s cubic-bezier(0.16, 1, 0.3, 1); }
#topbar a:hover { color: var(--cobalt); }

/* ─── Main ───────────────────────────────────────────────── */
#main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1.1fr);
  gap: 0;
  padding: 0 40px;
  overflow: hidden;
  align-items: stretch;
}

/* ─── Left column ────────────────────────────────────────── */
#left {
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 32px 40px 32px 0;
  overflow: hidden;
}

/* XMB icon bar */
#cat-track {
  position: relative;
  width: 100%;
  height: 56px;
  margin-bottom: 28px;
  flex-shrink: 0;
}
.cat-item {
  position: absolute; top: 50%;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer;
  transition: left .38s cubic-bezier(0.16, 1, 0.3, 1), opacity .38s cubic-bezier(0.16, 1, 0.3, 1), transform .38s cubic-bezier(0.16, 1, 0.3, 1);
}
.cat-icon svg {
  display: block; fill: none;
  stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
  transition: width .3s cubic-bezier(0.16, 1, 0.3, 1), height .3s cubic-bezier(0.16, 1, 0.3, 1), filter .3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Selected category name */
#cat-name {
  font-size: clamp(52px, 6vw, 80px);
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--h);
  line-height: 1;
  margin-bottom: 24px;
  flex-shrink: 0;
  overflow: hidden;
}
#cat-name-inner {
  display: block;
  will-change: opacity, transform;
}

/* Divider */
.h-rule {
  width: 100%; height: 1px;
  background: var(--rule);
  flex-shrink: 0;
}

/* Items list */
#items-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
#items-list::-webkit-scrollbar { display: none; }

/* L2 items */
.l2-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: color .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.l2-name {
  font-size: clamp(28px, 3.8vw, 54px);
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--mid);
  line-height: 1;
  transition: color .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.l2-arrow {
  font-size: 13px;
  color: var(--cobalt);
  opacity: 0;
  transform: translateX(-5px);
  transition: opacity .2s cubic-bezier(0.16, 1, 0.3, 1), transform .2s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
}
.l2-item:hover .l2-name,
.l2-item.active .l2-name { color: var(--h); }
.l2-item.active .l2-arrow { opacity: 1; transform: translateX(0); }
.l2-item:hover .l2-arrow  { opacity: 0.5; transform: translateX(0); }

/* L3 items (when drilled in) */
.l3-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: color .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.l3-name {
  font-size: clamp(18px, 2.2vw, 32px);
  font-weight: 300;
  letter-spacing: -0.01em;
  color: var(--mid);
  line-height: 1.1;
  transition: color .2s cubic-bezier(0.16, 1, 0.3, 1);
}
.l3-arrow {
  font-size: 10px; color: var(--cobalt);
  opacity: 0; transform: translateX(-4px);
  transition: opacity .2s cubic-bezier(0.16, 1, 0.3, 1), transform .2s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
}
.l3-item:hover .l3-name,
.l3-item.active .l3-name { color: var(--h); }
.l3-item.active .l3-arrow,
.l3-item:hover .l3-arrow  { opacity: 1; transform: translateX(0); }

/* Back breadcrumb */
#breadcrumb {
  display: none; align-items: center; gap: 8px;
  padding-bottom: 14px; margin-bottom: 4px;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim); font-weight: 400;
  cursor: pointer;
  transition: color .2s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
}
#breadcrumb.visible { display: flex; }
#breadcrumb:hover { color: var(--cobalt); }
#breadcrumb .bc-arrow { font-size: 10px; }

/* ─── V-rule ──────────────────────────────────────────────── */
#v-rule {
  background: var(--rule);
  margin: 48px 0;
  align-self: stretch;
}

/* ─── Right column (detail) ──────────────────────────────── */
#right {
  padding: 32px 0 32px 40px;
  display: flex; flex-direction: column;
  justify-content: center;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,91,255,0.3) transparent;
}
#right::-webkit-scrollbar { width: 2px; }
#right::-webkit-scrollbar-thumb { background: var(--cobalt); opacity: 0.3; }

#detail-wrap { transition: opacity .22s cubic-bezier(0.16, 1, 0.3, 1); }
#detail-label {
  font-size: clamp(11px, 1.1vw, 13px);
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--cobalt); font-weight: 400;
  margin-bottom: 16px;
}
#detail-body {
  font-size: clamp(12px, 1.1vw, 14px);
  font-weight: 400;
  line-height: 1.85;
  color: var(--mid);
  white-space: pre-line;
  max-width: 420px;
}
#detail-body strong { color: var(--h); font-weight: 700; }

/* empty state */
#detail-hint {
  font-size: clamp(12px, 1.05vw, 14px);
  color: var(--dim); font-weight: 300;
  font-style: italic;
  transition: opacity .22s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ─── Footer ─────────────────────────────────────────────── */
#footer {
  padding: 0 40px 20px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--dim); font-weight: 400;
  flex-shrink: 0;
}
#focus-indicator {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cobalt);
  box-shadow: 0 0 8px var(--cobalt);
  transition: background .2s;
}

/* ─── Mobile ─────────────────────────────────────────────── */
@media (max-width: 700px) {
  html, body { overflow-y: auto; height: auto; }
  #ui, canvas#bg { position: relative; }
  #main { grid-template-columns: 1fr; padding: 0 20px; }
  #v-rule { display: none; }
  #left { padding: 24px 0; }
  #right { padding: 0 0 32px; }
  #topbar { padding: 18px 20px 0; }
  #footer { padding: 0 20px 18px; }
}
</style>
</head>

// ── State ─────────────────────────────────────────────────────────────────────
let catIdx = 0;
let l2Idx  = 0;
let l3Idx  = 0;
let depth  = 2; // 2 = showing L2 items, 3 = drilled into L3
// depth naming: level 2 = the list under a category (always visible)
//               level 3 = children of an L2 item (drill-in)

function cat()      { return CAT[catIdx]; }
function l2list()   { return cat().items; }
function curL2()    { return l2list()[l2Idx]; }
function hasKids()  { return !!(curL2().children && curL2().children.length); }
function kids()     { return hasKids() ? curL2().children : []; }

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  const d = new Date();
  document.getElementById('clk').textContent =
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick, 20000);

// ── Render ────────────────────────────────────────────────────────────────────
const trackEl   = document.getElementById('cat-track');
const nameEl    = document.getElementById('cat-name-inner');
const listEl    = document.getElementById('items-list');
const bcEl      = document.getElementById('breadcrumb');
const bcLbl     = document.getElementById('bc-label');
const detWrap   = document.getElementById('detail-wrap');
const detLabel  = document.getElementById('detail-label');
const detBody   = document.getElementById('detail-body');
const detHint   = document.getElementById('detail-hint');
const focInd    = document.getElementById('focus-indicator');

function renderCats() {
  trackEl.innerHTML = '';
  const W   = window.innerWidth;
  const cx  = Math.min(W * 0.22, 200);
  const spc = Math.min(80, W / 8);

  CAT.forEach((c, i) => {
    const el  = document.createElement('div');
    el.className = 'cat-item';
    const off = i - catIdx;
    const abs = Math.abs(off);
    const sz  = abs === 0 ? 28 : abs === 1 ? 20 : 15;
    const col = abs === 0 ? 'var(--h)' : abs === 1 ? '#444' : '#2a2a2a';
    const glow= abs === 0
      ? `drop-shadow(0 0 6px rgba(0,91,255,.55)) drop-shadow(0 0 16px rgba(0,91,255,.22))`
      : 'none';

    el.innerHTML = `<div style="color:${col};filter:${glow}">
      ${c.icon.replace('<svg', `<svg width="${sz}" height="${sz}"`)}</div>`;
    el.style.cssText =
      `left:${cx + off*spc}px;` +
      `transform:translateX(-50%) translateY(-50%);` +
      `opacity:${abs===0?1:abs===1?0.4:0.15};`;
    el.addEventListener('click', () => { catIdx=i; l2Idx=0; l3Idx=0; depth=2; render(); });
    trackEl.appendChild(el);
  });
}

function renderName() {
  const el = document.getElementById('cat-name-inner');
  el.style.transition = 'none';
  el.style.opacity = '0';
  el.style.transform = 'translateY(12px)';
  el.textContent = cat().label;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = 'opacity 0.38s cubic-bezier(0.16,1,0.3,1), transform 0.38s cubic-bezier(0.16,1,0.3,1)';
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }));
}

function animIn(el, delay) {
  el.style.opacity = '0';
  el.style.transform = 'translateX(-12px)';
  el.style.transition = 'none';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = `opacity 0.42s cubic-bezier(0.16,1,0.3,1) ${delay}ms, transform 0.42s cubic-bezier(0.16,1,0.3,1) ${delay}ms`;
    el.style.opacity = '1';
    el.style.transform = 'translateX(0)';
  }));
}

function renderList() {
  listEl.innerHTML = '';

  if (depth === 3) {
    bcEl.classList.add('visible');
    bcLbl.textContent = curL2().label.toUpperCase();
    kids().forEach((child, i) => {
      const el = document.createElement('div');
      el.className = 'l3-item' + (i === l3Idx ? ' active' : '');
      el.innerHTML = `<span class="l3-name">${child.label}</span><span class="l3-arrow">→</span>`;
      animIn(el, i * 38);
      el.addEventListener('click', () => { l3Idx=i; renderList(); renderDetail(); });
      listEl.appendChild(el);
    });
  } else {
    bcEl.classList.remove('visible');
    l2list().forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'l2-item' + (i === l2Idx ? ' active' : '');
      const hasC = !!(item.children && item.children.length);
      el.innerHTML = `<span class="l2-name">${item.label}</span><span class="l2-arrow">${hasC ? '→' : ''}</span>`;
      animIn(el, i * 44);
      el.addEventListener('click', () => {
        l2Idx = i;
        if (hasC) { l3Idx=0; depth=3; }
        renderList(); renderDetail();
      });
      listEl.appendChild(el);
    });
  }

  focInd.style.background = depth === 3 ? 'rgba(0,91,255,0.5)' : '#005BFF';
}

function renderDetail() {
  const item = depth === 3 ? kids()[l3Idx] : curL2();

  if (!item || hasKids() && depth === 2) {
    detWrap.style.opacity = '0';
    detHint.style.opacity = '1';
    return;
  }
  detHint.style.opacity = '0';

  const label = depth === 3
    ? `${cat().label} / ${curL2().label} / ${item.label}`
    : `${cat().label} / ${item.label}`;

  detWrap.style.opacity = '0';
  setTimeout(() => {
    detLabel.textContent = label.toUpperCase();
    if (item.link) {
      detBody.innerHTML = `<a href="${item.link}" target="_blank" rel="noopener"
        style="color:var(--cobalt);text-decoration:none;font-size:inherit;line-height:inherit">
        ${item.desc}</a>`;
    } else {
      detBody.textContent = item.desc || '';
    }
    detWrap.style.opacity = '1';
  }, 100);
}

function render() {
  renderCats();
  renderName();
  renderList();
  renderDetail();
}
render();
window.addEventListener('resize', () => { renderCats(); });

// ── Keyboard ──────────────────────────────────────────────────────────────────
function goBack() {
  depth = 2; l3Idx = 0; renderList(); renderDetail();
}

document.addEventListener('keydown', e => {
  const nCat = CAT.length;
  const nL2  = l2list().length;
  const nL3  = kids().length;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (depth === 3) { goBack(); return; }
    catIdx = (catIdx - 1 + nCat) % nCat;
    l2Idx = 0; l3Idx = 0; depth = 2; render();
  }
  else if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (depth === 3) { catIdx = (catIdx + 1) % nCat; l2Idx=0; l3Idx=0; depth=2; render(); return; }
    catIdx = (catIdx + 1) % nCat;
    l2Idx = 0; l3Idx = 0; depth = 2; render();
  }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (depth === 2 && hasKids()) { depth = 3; l3Idx = 0; renderList(); renderDetail(); }
    else if (curL2().link) window.open(curL2().link, '_blank');
  }
  else if (e.key === 'Escape') {
    e.preventDefault();
    if (depth === 3) { goBack(); }
  }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (depth === 3) { l3Idx = (l3Idx + 1) % Math.max(1, nL3); renderList(); renderDetail(); }
    else             { l2Idx = (l2Idx + 1) % nL2; renderList(); renderDetail(); }
  }
  else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (depth === 3) { l3Idx = (l3Idx - 1 + Math.max(1, nL3)) % Math.max(1, nL3); renderList(); renderDetail(); }
    else             { l2Idx = (l2Idx - 1 + nL2) % nL2; renderList(); renderDetail(); }
  }
});

// ── Canvas background ─────────────────────────────────────────────────────────
(function () {
  const cv  = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  let W, H, t = 0;
  let matRows = [];
  let photoImg = null;

  // Zone boundaries
  const Z_PHOTO = 0.30; // 0 – Z_PHOTO: photo / placeholder
  const Z_FILM  = 0.40; // Z_PHOTO – Z_FILM: film strip
  const Z_MAT   = 0.97; // Z_FILM – Z_MAT: matrix
  // Z_MAT – 1.0: cobalt stripe

  // Matrix row data
  function rndI(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
  function makeRow(y) {
    return { y, vals: Array.from({ length: 16 }, () => rndI(0, 2500)), age: Math.random() * 500 };
  }

  function initMatrix() {
    const lh = 14;
    matRows = Array.from({ length: Math.ceil(H / lh) + 2 }, (_, i) => makeRow(i * lh));
  }

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    initMatrix();
  }

  // Load user photo if set
  if (PHOTO_SRC) {
    photoImg = new Image();
    photoImg.src = PHOTO_SRC;
  }

  function drawPhotoZone() {
    const pw = W * Z_PHOTO;
    // Dark background
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, pw, H);

    if (photoImg && photoImg.complete && photoImg.naturalWidth) {
      // Cover-fit the photo
      const iw = photoImg.naturalWidth, ih = photoImg.naturalHeight;
      const scale = Math.max(pw / iw, H / ih);
      const dw = iw * scale, dh = ih * scale;
      const dx = (pw - dw) / 2, dy = (H - dh) / 2;
      ctx.drawImage(photoImg, dx, dy, dw, dh);
      // Subtle dark vignette over photo
      const vg = ctx.createLinearGradient(pw - 60, 0, pw, 0);
      vg.addColorStop(0, 'transparent');
      vg.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, pw, H);
    } else {
      // Placeholder: silhouette outline
      ctx.strokeStyle = 'rgba(0,91,255,0.12)';
      ctx.lineWidth = 1;
      const cx2 = pw / 2, cy2 = H * 0.38, r = Math.min(pw, H) * 0.1;
      ctx.beginPath(); ctx.arc(cx2, cy2 - r * 0.3, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx2 - r * 1.4, cy2 + r * 2.2);
      ctx.quadraticCurveTo(cx2, cy2 + r * 0.6, cx2 + r * 1.4, cy2 + r * 2.2);
      ctx.stroke();
      // "PHOTO" hint
      ctx.font = '700 9px "Helvetica Neue", Helvetica, sans-serif';
      ctx.fillStyle = 'rgba(0,91,255,0.22)';
      ctx.textAlign = 'center';
      ctx.fillText('ADD PHOTO', cx2, cy2 + r * 3.2);
      ctx.textAlign = 'left';
    }
  }

  function drawFilmStrip() {
    const fx = W * Z_PHOTO;
    const fw = W * (Z_FILM - Z_PHOTO);
    ctx.fillStyle = 'rgba(0,0,0,0.94)';
    ctx.fillRect(fx, 0, fw, H);
    // perforations
    const ph = 10, pw2 = 7, gap = 20, mg = 4;
    for (let py = 6; py < H - ph; py += gap) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(fx + mg, py, pw2, ph);
      ctx.fillRect(fx + fw - mg - pw2, py, pw2, ph);
    }
    // cobalt edge glow on film strip
    const eg = ctx.createLinearGradient(fx, 0, fx + fw, 0);
    eg.addColorStop(0, 'rgba(0,91,255,0.18)');
    eg.addColorStop(0.5, 'transparent');
    eg.addColorStop(1, 'rgba(0,91,255,0.12)');
    ctx.fillStyle = eg; ctx.fillRect(fx, 0, fw, H);
  }

  const MC = ['#ff4444', '#4488ff', '#44ff88', '#ffffff', '#ff9944', '#ffffff'];
  function hexRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawMatrix() {
    const mx = W * Z_FILM;
    const mw = W * (Z_MAT - Z_FILM);
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    ctx.fillRect(mx, 0, mw, H);
    ctx.font = '10px "Helvetica Neue",Helvetica,monospace';

    matRows.forEach(row => {
      row.age += 0.25;
      if (Math.random() < 0.003) row.vals = Array.from({ length: 16 }, () => rndI(0, 2500));
      let x = mx + 6;
      row.vals.forEach((v, vi) => {
        const str = v + ',';
        ctx.fillStyle = hexRgba(MC[vi % MC.length], 0.22);
        ctx.fillText(str, x, row.y);
        x += ctx.measureText(str).width;
        if (x > mx + mw - 14) return;
      });
    });
  }

  function drawCobaltStripe() {
    const sx = W * Z_MAT;
    const sw = W * (1 - Z_MAT);
    ctx.fillStyle = '#005BFF';
    ctx.fillRect(sx, 0, sw, H);
    // glow
    const sg = ctx.createLinearGradient(sx - 24, 0, sx + sw, 0);
    sg.addColorStop(0, 'rgba(0,91,255,0.22)');
    sg.addColorStop(0.4, 'transparent');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 24, 0, sw + 24, H);
  }

  function frame() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawPhotoZone();
    drawFilmStrip();
    drawMatrix();
    drawCobaltStripe();
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
